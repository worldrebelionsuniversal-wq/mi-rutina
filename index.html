<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SEGUIMIENTO DIARIO DE RUTINAS WRU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            padding: 20px 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 560px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Encabezado */
        .app-header {
            text-align: center;
            padding: 40px 0 12px;
            margin-bottom: 12px;
            border-bottom: 2px solid #ffffff;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }

        /* Fecha actual */
        .fecha-info {
            text-align: center;
            font-size: 15px;
            color: #ffffff;
            background: transparent;
            padding: 8px 16px 16px;
            border-radius: 0;
            margin-bottom: 8px;
            border: none;
            font-weight: 500;
        }
        .fecha-info span {
            font-weight: 700;
            color: #ffffff;
        }

        /* Contenedor de rutinas - ocupa el espacio disponible */
        #rutinasContainer {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 10px;
        }

        /* Tarjetas de rutina */
        .rutina-card {
            background: #000000;
            border-radius: 0;
            margin-bottom: 14px;
            border: 1px solid #333333;
            overflow: hidden;
            transition: 0.2s;
        }
        .rutina-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            border-bottom: 1px solid transparent;
        }
        .rutina-header:active { background: #111111; }
        .rutina-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .rutina-header .horario {
            font-size: 12px;
            font-weight: 400;
            color: #666666;
        }
        .rutina-header .badge {
            font-size: 11px;
            background: transparent;
            padding: 0;
            border-radius: 0;
            color: #4ade80;
            font-weight: 600;
            border: none;
        }
        .rutina-header .arrow {
            font-size: 18px;
            color: #666666;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .rutina-header .arrow.open {
            transform: rotate(180deg);
        }
        .rutina-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 16px;
        }
        .rutina-body.open {
            max-height: 2000px;
            padding: 0 16px 16px;
        }

        .accion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 8px;
            margin: 4px 0;
            background: transparent;
            border-radius: 0;
            transition: background 0.15s;
            flex-wrap: wrap;
            border-left: 3px solid transparent;
        }
        .accion-item.fallada {
            background: #0a0505;
            border-left-color: #ef4444;
        }
        .accion-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #22c55e;
            cursor: pointer;
            flex-shrink: 0;
            border-radius: 4px;
            background: #000000;
        }
        .accion-item input[type="checkbox"]:checked {
            accent-color: #22c55e;
        }
        .accion-item .label-text {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: #e0e0e0;
            min-width: 100px;
        }
        .accion-item .label-text.completada {
            text-decoration: line-through;
            color: #555555;
            font-weight: 400;
        }
        .accion-item .fallo {
            display: none;
            width: 100%;
            margin-top: 4px;
        }
        .accion-item .fallo input {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #333333;
            border-radius: 30px;
            font-size: 13px;
            background: #000000;
            color: #e0e0e0;
            outline: none;
            transition: 0.2s;
        }
        .accion-item .fallo input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 2px rgba(239,68,68,0.15);
        }
        .accion-item.fallada .fallo {
            display: block;
        }
        .toggle-justificacion {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 30px;
            color: #666666;
            transition: 0.1s;
            line-height: 1;
        }
        .toggle-justificacion:active {
            background: #1a1a1a;
        }

        /* Botón guardar - abajo siempre */
        .btn-wrapper {
            margin-top: auto;
            padding: 10px 0 20px;
        }
        .btn-guardar-principal {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 20px rgba(255,255,255,0.05);
        }
        .btn-guardar-principal:active {
            transform: scale(0.97);
            background: #e0e0e0;
        }
        .mensaje-guardado {
            text-align: center;
            padding: 12px;
            background: #0a1a0a;
            color: #4ade80;
            border-radius: 40px;
            margin-top: 8px;
            font-weight: 500;
            display: none;
            font-size: 15px;
            border: 1px solid #1a3a1a;
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444444;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Encabezado -->
    <div class="app-header">
        <h1>SEGUIMIENTO DIARIO DE RUTINAS WRU</h1>
    </div>

    <!-- Fecha actual -->
    <div class="fecha-info" id="fechaInfo">
        <span id="fechaDisplay">Cargando...</span>
    </div>

    <!-- Contenedor de rutinas -->
    <div id="rutinasContainer"></div>

    <!-- Botón guardar - siempre abajo -->
    <div class="btn-wrapper">
        <button class="btn-guardar-principal" onclick="guardarDia()">Guardar día en Google Sheets</button>
        <div class="mensaje-guardado" id="mensajeGuardado">¡Guardado correctamente!</div>
    </div>

</div>

<script>
    // --------------------------------------------------------------
    //  RUTINAS DEFINIDAS
    // --------------------------------------------------------------
    const RUTINAS = [
        {
            id: 'manana',
            nombre: '🌅 RUTINA DE MAÑANA',
            horario: '5:00 AM',
            acciones: [
                'Tender cama',
                'Poner música six nine',
                'Hacer plan de entrenamiento',
                'Tomar agua con limón y sal',
                'Lectura de 21 principios',
                'Tomar ducha fría solo axilas y zona íntima',
                'Lavar cara con jabón dove',
                'Aplicar desodorante solo si se va salir al exterior',
                'Desayunar',
                'Cepillar dientes e hidratar labios',
                'Desactivar No molestar en celular'
            ]
        },
        {
            id: 'tarde',
            nombre: '☀️ RUTINA DE TARDE',
            horario: '',
            acciones: [
                'Almorzar sin distracciones',
                'Cepillarse e hidratar labios',
                'Enjuague bucal solo si se está fuera de casa',
                'Lavar cara con jabón dove si es necesario'
            ]
        },
        {
            id: 'noche',
            nombre: '🌙 RUTINA DE NOCHE',
            horario: '9:30 PM',
            acciones: [
                'Apagar celulares, pantallas o computadores',
                'Activar No molestar en celular',
                'Limpiar habitación, barrer y trapear',
                'Limpiar dispositivos electrónicos',
                'Ventilar habitación',
                'Tomar ducha caliente',
                'Lavar cabello con shampoo días lunes y viernes',
                'Afeitar barba',
                'Exfoliación facial lunes y viernes',
                'Lavar cara con jabón dove',
                'Cepillar dientes e hidratar labios'
            ]
        }
    ];

    // --------------------------------------------------------------
    //  ESTADO GLOBAL
    // --------------------------------------------------------------
    let estado = {};
    let fechaActual = '';

    // --------------------------------------------------------------
    //  UTILIDADES
    // --------------------------------------------------------------
    function formatearFecha(fecha) {
        const d = new Date(fecha);
        return d.toISOString().split('T')[0];
    }

    function formatearFechaLegible(fecha) {
        const d = new Date(fecha);
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return d.toLocaleDateString('es-ES', opciones);
    }

    function diaActual() {
        const hoy = new Date();
        fechaActual = formatearFecha(hoy);
        document.getElementById('fechaDisplay').textContent = formatearFechaLegible(hoy);
        cargarDia();
    }

    // --------------------------------------------------------------
    //  CARGAR DÍA
    // --------------------------------------------------------------
    function cargarDia() {
        const key = `rutinas_${fechaActual}`;
        const guardado = localStorage.getItem(key);

        if (guardado) {
            estado = JSON.parse(guardado);
        } else {
            estado = {};
            RUTINAS.forEach(rutina => {
                estado[rutina.id] = { completadas: {}, justificaciones: {} };
                rutina.acciones.forEach((_, index) => {
                    estado[rutina.id].completadas[index] = true;
                    estado[rutina.id].justificaciones[index] = '';
                });
            });
        }
        renderizarRutinas();
    }

    // --------------------------------------------------------------
    //  RENDERIZAR RUTINAS
    // --------------------------------------------------------------
    function renderizarRutinas() {
        const container = document.getElementById('rutinasContainer');
        container.innerHTML = '';

        RUTINAS.forEach((rutina) => {
            const data = estado[rutina.id] || { completadas: {}, justificaciones: {} };
            
            let completadas = 0;
            rutina.acciones.forEach((_, i) => {
                if (data.completadas[i] !== false) completadas++;
            });
            const total = rutina.acciones.length;
            const pct = total > 0 ? Math.round((completadas / total) * 100) : 0;

            const card = document.createElement('div');
            card.className = 'rutina-card';

            const header = document.createElement('div');
            header.className = 'rutina-header';
            header.innerHTML = `
                <h2>${rutina.nombre} ${rutina.horario ? '<span class="horario">' + rutina.horario + '</span>' : ''}</h2>
                <div>
                    <span class="badge">${pct}%</span>
                    <span class="arrow" id="arrow_${rutina.id}">▼</span>
                </div>
            `;
            header.addEventListener('click', () => toggleRutina(rutina.id));

            const body = document.createElement('div');
            body.className = 'rutina-body';
            body.id = `body_${rutina.id}`;

            let accionesHTML = rutina.acciones.map((accion, i) => {
                const completada = data.completadas[i] !== false;
                const justif = data.justificaciones[i] || '';
                return `
                    <div class="accion-item ${!completada ? 'fallada' : ''}">
                        <input type="checkbox" ${completada ? 'checked' : ''} onchange="toggleAccion('${rutina.id}', ${i})">
                        <span class="label-text ${completada ? 'completada' : ''}">${accion}</span>
                        <button class="toggle-justificacion" onclick="toggleJustificacion('${rutina.id}', ${i})">
                            ${justif ? '✏️' : '📝'}
                        </button>
                        <div class="fallo">
                            <input type="text" placeholder="¿Por qué no lo hiciste?" value="${justif}" onchange="guardarJustificacion('${rutina.id}', ${i}, this.value)">
                        </div>
                    </div>
                `;
            }).join('');

            body.innerHTML = accionesHTML;
            card.appendChild(header);
            card.appendChild(body);
            container.appendChild(card);
        });

        // Todas las rutinas empiezan cerradas
        RUTINAS.forEach(r => {
            const body = document.getElementById(`body_${r.id}`);
            const arrow = document.getElementById(`arrow_${r.id}`);
            if (body) {
                body.classList.remove('open');
                if (arrow) arrow.classList.remove('open');
            }
        });
    }

    // --------------------------------------------------------------
    //  ACORDEÓN
    // --------------------------------------------------------------
    function toggleRutina(rutinaId) {
        const body = document.getElementById(`body_${rutinaId}`);
        const arrow = document.getElementById(`arrow_${rutinaId}`);
        if (body) {
            body.classList.toggle('open');
            if (arrow) arrow.classList.toggle('open');
        }
    }

    // --------------------------------------------------------------
    //  INTERACCIONES
    // --------------------------------------------------------------
    function toggleAccion(rutinaId, index) {
        if (!estado[rutinaId]) estado[rutinaId] = { completadas: {}, justificaciones: {} };
        estado[rutinaId].completadas[index] = !estado[rutinaId].completadas[index];
        if (estado[rutinaId].completadas[index]) {
            estado[rutinaId].justificaciones[index] = '';
        }
        renderizarRutinasManteniendoEstado();
        guardarAutomatico();
    }

    function renderizarRutinasManteniendoEstado() {
        const abiertas = {};
        RUTINAS.forEach(r => {
            const body = document.getElementById(`body_${r.id}`);
            if (body && body.classList.contains('open')) {
                abiertas[r.id] = true;
            }
        });

        renderizarRutinas();

        RUTINAS.forEach(r => {
            if (abiertas[r.id]) {
                const body = document.getElementById(`body_${r.id}`);
                const arrow = document.getElementById(`arrow_${r.id}`);
                if (body) {
                    body.classList.add('open');
                    if (arrow) arrow.classList.add('open');
                }
            }
        });
    }

    function guardarJustificacion(rutinaId, index, valor) {
        if (!estado[rutinaId]) estado[rutinaId] = { completadas: {}, justificaciones: {} };
        estado[rutinaId].justificaciones[index] = valor;
        guardarAutomatico();
    }

    function toggleJustificacion(rutinaId, index) {}

    // --------------------------------------------------------------
    //  GUARDAR
    // --------------------------------------------------------------
    function guardarAutomatico() {
        if (fechaActual) localStorage.setItem(`rutinas_${fechaActual}`, JSON.stringify(estado));
    }

    function guardarDia() {
        if (!fechaActual) {
            alert('Error: No hay fecha seleccionada.');
            return;
        }

        localStorage.setItem(`rutinas_${fechaActual}`, JSON.stringify(estado));

        const datos = {
            fecha: fechaActual,
            rutinas: []
        };

        RUTINAS.forEach(rutina => {
            const data = estado[rutina.id] || { completadas: {}, justificaciones: {} };
            const acciones = rutina.acciones.map((accion, i) => ({
                accion: accion,
                completada: data.completadas[i] !== false,
                justificacion: data.justificaciones[i] || ''
            }));
            datos.rutinas.push({
                nombre: rutina.nombre,
                horario: rutina.horario,
                acciones: acciones
            });
        });

        // ============================================================
        //  CONEXIÓN CON GOOGLE APPS SCRIPT
        //  ⚠️ REEMPLAZA CON TU URL DE WEB APP
        // ============================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/TU_ID_AQUI/exec';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mostrarMensaje('¡Datos enviados a Google Sheets!');
        })
        .catch(error => {
            console.error('Error:', error);
            mostrarMensaje('Error al enviar. Revisa la consola.', true);
        });

        mostrarMensaje('Datos guardados localmente');
    }

    function mostrarMensaje(texto, esError = false) {
        const msg = document.getElementById('mensajeGuardado');
        msg.textContent = texto;
        msg.style.display = 'block';
        if (esError) {
            msg.style.background = '#1a0a0a';
            msg.style.color = '#ef4444';
            msg.style.borderColor = '#3a1a1a';
        } else {
            msg.style.background = '#0a1a0a';
            msg.style.color = '#4ade80';
            msg.style.borderColor = '#1a3a1a';
        }
        setTimeout(() => {
            msg.style.display = 'none';
            msg.style.background = '#0a1a0a';
            msg.style.color = '#4ade80';
            msg.style.borderColor = '#1a3a1a';
        }, 4000);
    }

    // --------------------------------------------------------------
    //  INICIAR
    // --------------------------------------------------------------
    diaActual();
    setInterval(guardarAutomatico, 10000);
</script>
</body>
</html>
