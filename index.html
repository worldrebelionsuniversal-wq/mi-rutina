<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SEGUIMIENTO DIARIO DE RUTINAS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f9;
            padding: 16px 12px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 560px;
            width: 100%;
        }

        /* Encabezado */
        .app-header {
            text-align: center;
            padding: 12px 0 16px;
            margin-bottom: 14px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #1a2634;
            background: linear-gradient(135deg, #1a2634 0%, #3a4f6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-header .sub {
            font-size: 13px;
            color: #7a8a9e;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* Fecha actual (solo informativa, sin selector) */
        .fecha-info {
            text-align: center;
            font-size: 14px;
            color: #5a6a7e;
            background: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            font-weight: 500;
        }
        .fecha-info span {
            font-weight: 700;
            color: #1a2634;
        }

        /* Tarjetas de rutina - acordeón */
        .rutina-card {
            background: white;
            border-radius: 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
            overflow: hidden;
            transition: 0.2s;
        }
        .rutina-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            border-bottom: 1px solid transparent;
        }
        .rutina-header:active { background: #f5f8fc; }
        .rutina-header h2 {
            font-size: 17px;
            font-weight: 700;
            color: #1a2634;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .rutina-header .horario {
            font-size: 13px;
            font-weight: 400;
            color: #7a8a9e;
        }
        .rutina-header .badge {
            font-size: 12px;
            background: #eef3fc;
            padding: 3px 12px;
            border-radius: 20px;
            color: #3a5a7a;
            font-weight: 600;
        }
        .rutina-header .arrow {
            font-size: 20px;
            color: #7a8a9e;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        .rutina-header .arrow.open {
            transform: rotate(180deg);
        }
        .rutina-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0 18px;
        }
        .rutina-body.open {
            max-height: 2000px;
            padding: 0 18px 16px;
        }

        .accion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 8px;
            margin: 4px 0;
            background: #f9fafc;
            border-radius: 14px;
            transition: background 0.15s;
            flex-wrap: wrap;
            border-left: 3px solid transparent;
        }
        .accion-item.fallada {
            background: #fef6f5;
            border-left-color: #d9534f;
        }
        .accion-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #2a7a5a;
            cursor: pointer;
            flex-shrink: 0;
            border-radius: 5px;
        }
        .accion-item .label-text {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: #1f2a3c;
            min-width: 100px;
        }
        .accion-item .label-text.completada {
            text-decoration: line-through;
            color: #8e9aad;
            font-weight: 400;
        }
        .accion-item .fallo {
            display: none;
            width: 100%;
            margin-top: 4px;
        }
        .accion-item .fallo input {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #e2d2d0;
            border-radius: 30px;
            font-size: 13px;
            background: #fffbfa;
            color: #2d3a4a;
            outline: none;
            transition: 0.2s;
        }
        .accion-item .fallo input:focus {
            border-color: #d9534f;
            box-shadow: 0 0 0 2px rgba(217,83,79,0.12);
        }
        .accion-item.fallada .fallo {
            display: block;
        }
        .toggle-justificacion {
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 30px;
            color: #5f6b7a;
            transition: 0.1s;
            line-height: 1;
        }
        .toggle-justificacion:active {
            background: #eef0f5;
        }

        /* Botón guardar principal */
        .btn-guardar-principal {
            width: 100%;
            padding: 16px;
            background: #1a2634;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.15s;
            box-shadow: 0 4px 14px rgba(26,38,52,0.15);
        }
        .btn-guardar-principal:active {
            transform: scale(0.97);
            background: #2f4057;
        }
        .mensaje-guardado {
            text-align: center;
            padding: 12px;
            background: #dff0e6;
            color: #1a5a3a;
            border-radius: 40px;
            margin-top: 12px;
            font-weight: 500;
            display: none;
            font-size: 15px;
        }

        /* Dark mode suave */
        @media (prefers-color-scheme: dark) {
            body { background: #161c28; }
            .rutina-card, .fecha-info { background: #242d3d; border-color: #2f3a4e; }
            .app-header h1 { background: linear-gradient(135deg, #c8d8f0, #a0b8d8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
            .app-header .sub { color: #8899b0; }
            .fecha-info { color: #8899b0; }
            .fecha-info span { color: #d8e0ec; }
            .rutina-header h2 { color: #dde4ef; }
            .rutina-header .horario { color: #8899b0; }
            .rutina-header .badge { background: #2a3a52; color: #9cb8e0; }
            .accion-item { background: #1f2838; }
            .accion-item .label-text { color: #d8e0ec; }
            .accion-item .label-text.completada { color: #6a7b92; }
            .accion-item.fallada { background: #2f2328; border-left-color: #d9534f; }
            .accion-item .fallo input { background: #2f2328; border-color: #5a3e3e; color: #d8e0ec; }
            .btn-guardar-principal { background: #3a4a6b; }
            .mensaje-guardado { background: #1f3a2e; color: #b0d8c0; }
            .rutina-header:active { background: #1f2838; }
            .toggle-justificacion:active { background: #2f3a4e; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Encabezado -->
    <div class="app-header">
        <h1>SEGUIMIENTO DIARIO</h1>
        <div class="sub">RUTINAS • HÁBITOS • PROGRESO</div>
    </div>

    <!-- Fecha actual (solo informativa) -->
    <div class="fecha-info" id="fechaInfo">
        📅 <span id="fechaDisplay">Cargando...</span>
    </div>

    <!-- Contenedor de rutinas -->
    <div id="rutinasContainer"></div>

    <!-- Botón guardar -->
    <button class="btn-guardar-principal" onclick="guardarDia()">💾 Guardar día en Google Sheets</button>
    <div class="mensaje-guardado" id="mensajeGuardado">✅ ¡Guardado correctamente!</div>
</div>

<script>
    // --------------------------------------------------------------
    //  RUTINAS DEFINIDAS (según especificación)
    // --------------------------------------------------------------
    const RUTINAS = [
        {
            id: 'manana',
            nombre: '🌅 RUTINA DE MAÑANA',
            horario: '5:00 AM',
            acciones: [
                'Tender cama',
                'Poner música six nine',
                'Hacer plan de entrenamiento',
                'Tomar agua con limón y sal',
                'Lectura de 21 principios',
                'Tomar ducha fría solo axilas y zona íntima',
                'Lavar cara con jabón dove',
                'Aplicar desodorante solo si se va salir al exterior',
                'Desayunar',
                'Cepillar dientes e hidratar labios',
                'Desactivar No molestar en celular'
            ]
        },
        {
            id: 'tarde',
            nombre: '☀️ RUTINA DE TARDE',
            horario: '13:00 PM',
            acciones: [
                'Almorzar sin distracciones',
                'Cepillarse e hidratar labios',
                'Enjuague bucal solo si se está fuera de casa',
                'Lavar cara con jabón dove si es necesario'
            ]
        },
        {
            id: 'noche',
            nombre: '🌙 RUTINA DE NOCHE',
            horario: '9:30 PM',
            acciones: [
                'Apagar celulares, pantallas o computadores',
                'Activar No molestar en celular',
                'Limpiar habitación, barrer y trapear',
                'Limpiar dispositivos electrónicos',
                'Ventilar habitación',
                'Tomar ducha caliente',
                'Lavar cabello con shampoo días lunes y viernes',
                'Afeitar barba',
                'Exfoliación facial lunes y viernes',
                'Lavar cara con jabón dove',
                'Cepillar dientes e hidratar labios'
            ]
        }
    ];

    // --------------------------------------------------------------
    //  ESTADO GLOBAL
    // --------------------------------------------------------------
    let estado = {};
    let fechaActual = '';

    // --------------------------------------------------------------
    //  UTILIDADES
    // --------------------------------------------------------------
    function formatearFecha(fecha) {
        const d = new Date(fecha);
        return d.toISOString().split('T')[0];
    }

    function formatearFechaLegible(fecha) {
        const d = new Date(fecha);
        const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return d.toLocaleDateString('es-ES', opciones);
    }

    function diaActual() {
        const hoy = new Date();
        fechaActual = formatearFecha(hoy);
        document.getElementById('fechaDisplay').textContent = formatearFechaLegible(hoy);
        cargarDia();
    }

    // --------------------------------------------------------------
    //  CARGAR DÍA (desde localStorage)
    // --------------------------------------------------------------
    function cargarDia() {
        const key = `rutinas_${fechaActual}`;
        const guardado = localStorage.getItem(key);

        if (guardado) {
            estado = JSON.parse(guardado);
        } else {
            estado = {};
            RUTINAS.forEach(rutina => {
                estado[rutina.id] = { completadas: {}, justificaciones: {} };
                rutina.acciones.forEach((_, index) => {
                    estado[rutina.id].completadas[index] = true;
                    estado[rutina.id].justificaciones[index] = '';
                });
            });
        }
        renderizarRutinas();
    }

    // --------------------------------------------------------------
    //  RENDERIZAR RUTINAS (acordeón)
    // --------------------------------------------------------------
    function renderizarRutinas() {
        const container = document.getElementById('rutinasContainer');
        container.innerHTML = '';

        RUTINAS.forEach((rutina) => {
            const data = estado[rutina.id] || { completadas: {}, justificaciones: {} };
            
            let completadas = 0;
            rutina.acciones.forEach((_, i) => {
                if (data.completadas[i] !== false) completadas++;
            });
            const total = rutina.acciones.length;
            const pct = total > 0 ? Math.round((completadas / total) * 100) : 0;

            const card = document.createElement('div');
            card.className = 'rutina-card';

            const header = document.createElement('div');
            header.className = 'rutina-header';
            header.innerHTML = `
                <h2>${rutina.nombre} <span class="horario">${rutina.horario}</span></h2>
                <div>
                    <span class="badge">${pct}%</span>
                    <span class="arrow" id="arrow_${rutina.id}">▼</span>
                </div>
            `;
            header.addEventListener('click', () => toggleRutina(rutina.id));

            const body = document.createElement('div');
            body.className = 'rutina-body';
            body.id = `body_${rutina.id}`;

            let accionesHTML = rutina.acciones.map((accion, i) => {
                const completada = data.completadas[i] !== false;
                const justif = data.justificaciones[i] || '';
                return `
                    <div class="accion-item ${!completada ? 'fallada' : ''}">
                        <input type="checkbox" ${completada ? 'checked' : ''} onchange="toggleAccion('${rutina.id}', ${i})">
                        <span class="label-text ${completada ? 'completada' : ''}">${accion}</span>
                        <button class="toggle-justificacion" onclick="toggleJustificacion('${rutina.id}', ${i})">
                            ${justif ? '✏️' : '📝'}
                        </button>
                        <div class="fallo">
                            <input type="text" placeholder="¿Por qué no lo hiciste?" value="${justif}" onchange="guardarJustificacion('${rutina.id}', ${i}, this.value)">
                        </div>
                    </div>
                `;
            }).join('');

            body.innerHTML = accionesHTML;
            card.appendChild(header);
            card.appendChild(body);
            container.appendChild(card);
        });

        // Todas las rutinas empiezan cerradas
        RUTINAS.forEach(r => {
            const body = document.getElementById(`body_${r.id}`);
            const arrow = document.getElementById(`arrow_${r.id}`);
            if (body) {
                body.classList.remove('open');
                if (arrow) arrow.classList.remove('open');
            }
        });
    }

    // --------------------------------------------------------------
    //  ACORDEÓN
    // --------------------------------------------------------------
    function toggleRutina(rutinaId) {
        const body = document.getElementById(`body_${rutinaId}`);
        const arrow = document.getElementById(`arrow_${rutinaId}`);
        if (body) {
            body.classList.toggle('open');
            if (arrow) arrow.classList.toggle('open');
        }
    }

    // --------------------------------------------------------------
    //  INTERACCIONES
    // --------------------------------------------------------------
    function toggleAccion(rutinaId, index) {
        if (!estado[rutinaId]) estado[rutinaId] = { completadas: {}, justificaciones: {} };
        estado[rutinaId].completadas[index] = !estado[rutinaId].completadas[index];
        if (estado[rutinaId].completadas[index]) {
            estado[rutinaId].justificaciones[index] = '';
        }
        renderizarRutinas();
        guardarAutomatico();
    }

    function guardarJustificacion(rutinaId, index, valor) {
        if (!estado[rutinaId]) estado[rutinaId] = { completadas: {}, justificaciones: {} };
        estado[rutinaId].justificaciones[index] = valor;
        guardarAutomatico();
    }

    function toggleJustificacion(rutinaId, index) {
        // Mantener interacción visual
    }

    // --------------------------------------------------------------
    //  GUARDAR EN LOCALSTORAGE
    // --------------------------------------------------------------
    function guardarAutomatico() {
        if (fechaActual) localStorage.setItem(`rutinas_${fechaActual}`, JSON.stringify(estado));
    }

    // --------------------------------------------------------------
    //  GUARDAR EN GOOGLE SHEETS
    // --------------------------------------------------------------
    function guardarDia() {
        if (!fechaActual) {
            alert('Error: No hay fecha seleccionada.');
            return;
        }

        // Guardar localmente
        localStorage.setItem(`rutinas_${fechaActual}`, JSON.stringify(estado));

        // Construir datos
        const datos = {
            fecha: fechaActual,
            rutinas: []
        };

        RUTINAS.forEach(rutina => {
            const data = estado[rutina.id] || { completadas: {}, justificaciones: {} };
            const acciones = rutina.acciones.map((accion, i) => ({
                accion: accion,
                completada: data.completadas[i] !== false,
                justificacion: data.justificaciones[i] || ''
            }));
            datos.rutinas.push({
                nombre: rutina.nombre,
                horario: rutina.horario,
                acciones: acciones
            });
        });

        // ============================================================
        //  CONEXIÓN CON GOOGLE APPS SCRIPT
        //  Reemplaza con tu URL de Web App
        // ============================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/TU_ID_AQUI/exec';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mostrarMensaje('✅ ¡Datos enviados a Google Sheets!');
        })
        .catch(error => {
            console.error('Error:', error);
            mostrarMensaje('⚠️ Error al enviar. Revisa la consola.', true);
        });

        mostrarMensaje('💾 Datos guardados localmente');
    }

    function mostrarMensaje(texto, esError = false) {
        const msg = document.getElementById('mensajeGuardado');
        msg.textContent = texto;
        msg.style.display = 'block';
        if (esError) {
            msg.style.background = '#f8e0e0';
            msg.style.color = '#8a2a2a';
        } else {
            msg.style.background = '#dff0e6';
            msg.style.color = '#1a5a3a';
        }
        setTimeout(() => {
            msg.style.display = 'none';
            msg.style.background = '#dff0e6';
            msg.style.color = '#1a5a3a';
        }, 4000);
    }

    // --------------------------------------------------------------
    //  INICIAR
    // --------------------------------------------------------------
    diaActual();

    // Guardado automático cada 10 segundos
    setInterval(guardarAutomatico, 10000);
</script>
</body>
</html>
